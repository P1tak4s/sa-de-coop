[package]
name = "sa-coop"
version = "0.9.34"
edition = "2021"
description = "SA Co-op installer"
license = "GPL-3.0-only"
repository = "https://github.com/P1tak4s/sa-de-coop"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = "2"

[build-dependencies]
embed-resource = "3"
