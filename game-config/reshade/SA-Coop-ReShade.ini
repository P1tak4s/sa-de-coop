; SA Co-op ReShade look: a little sharper, richer colour, no banding in the sky.
; Home opens ReShade, Scroll Lock turns all effects on/off.
Techniques=Deband@Deband.fx,DELC_Sharpen@qUINT_sharp.fx,Lightroom@qUINT_lightroom.fx
TechniqueSorting=Deband@Deband.fx,DELC_Sharpen@qUINT_sharp.fx,Lightroom@qUINT_lightroom.fx

[qUINT_sharp.fx]
