; SA Co-op graphics, BALANCED (any GPU). Delete this file to get the game's own look back.
[SystemSettings]
; sharper image (the game's TAA is soft)
r.Tonemapper.Sharpen=0.7
; see further: buildings, props and foliage keep detail longer
r.ViewDistanceScale=2.0
r.StaticMeshLODDistanceScale=0.6
foliage.LODDistanceScale=2.0
r.SkeletalMeshLODBias=-1
; crisper textures at an angle
r.MaxAnisotropy=16
; better shadows
r.Shadow.MaxResolution=4096
r.Shadow.DistanceScale=1.5
r.Shadow.RadiusThreshold=0.01
; no smearing when turning
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
; less grain
r.SceneColorFringeQuality=0
r.Tonemapper.GrainQuantization=0
