; SA Co-op graphics, ULTRA (high-end GPUs, e.g. RTX 4070 and up; costs the most FPS). Delete this file to get the game's own look back.
[SystemSettings]
; sharper image: render a bit above screen resolution, then sharpen the game's soft TAA
r.ScreenPercentage=150
r.Tonemapper.Sharpen=0.6
r.TemporalAA.Upsampling=1
r.TemporalAACurrentFrameWeight=0.15
r.TemporalAASamples=8
r.PostProcessAAQuality=6
; see further: buildings, props and foliage keep detail longer
r.ViewDistanceScale=4.0
r.StaticMeshLODDistanceScale=0.25
foliage.LODDistanceScale=4.0
r.SkeletalMeshLODBias=-1
r.Streaming.PoolSize=6000
; crisper textures at an angle
r.MaxAnisotropy=16
; depth in corners and under cars
r.AmbientOcclusionLevels=3
r.AmbientOcclusion.Intensity=0.6
r.AmbientOcclusionMaxQuality=100
; reflections on wet roads and cars
r.SSR.Quality=4
r.SSR.MaxRoughness=0.8
; better shadows
r.Shadow.MaxResolution=8192
r.Shadow.MaxCSMResolution=8192
r.Shadow.DistanceScale=3.0
r.Shadow.CSM.MaxCascades=4
r.Shadow.RadiusThreshold=0.01
r.Shadow.FilterMethod=1
; light shafts and bloom a touch richer
r.LightShaftQuality=1
r.BloomQuality=5
; no smearing when turning
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
; less grain and colour fringing
r.SceneColorFringeQuality=0
r.Tonemapper.GrainQuantization=0
